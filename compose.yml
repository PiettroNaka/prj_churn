# docker compose up  →  substitui a linha gigante de flags do docker run.
# No Bloco 3 o Airflow inteiro sobe por um arquivo assim.
services:
  # Encontro 5: o dado entra por `dvc pull`, não pela imagem. Roda até o fim e
  # sai; o treino só começa depois que ele terminou bem.
  dados:
    build:
      context: .
      dockerfile: Dockerfile.dados
    volumes:
      - ./data:/app/data
      # o remote do DVC, montado onde o ../../dvc-storage da config aponta
      - ../dvc-storage:/dvc-storage
    command: pull

  # A UI dos experimentos: docker compose up mlflow  ->  localhost:5000
  # Atenção ao mundo: o caminho dos artefatos é gravado ABSOLUTO no banco. Runs
  # criados no host (artefatos em <repo>/mlruns) e runs criados em container
  # (/app/mlruns) não se misturam — as métricas aparecem nos dois casos, mas o
  # link do artefato só resolve no mundo em que o run nasceu. Escolha um.
  mlflow:
    build: .
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      uv run mlflow ui
      --backend-store-uri sqlite:////app/mlruns/mlflow.db
      --host 0.0.0.0 --port 5000
      --allowed-hosts localhost,127.0.0.1,localhost:5000,127.0.0.1:5000

  treino:
    build: .
    depends_on:
      dados:
        condition: service_completed_successfully
    environment:
      # Encontro 6: o run tem de sobreviver ao container. Banco e artefatos vão
      # para o mesmo volume, senão o experimento morre junto com o processo.
      CHURN_MLFLOW_TRACKING_URI: sqlite:////app/mlruns/mlflow.db
    volumes:
      # bind mounts: edita no host, roda dentro do container, sem rebuild
      - ./src:/app/src
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns
    command: uv run python -m churn.model
