[project]
name = "churn"
version = "0.1.0"
description = "Previsão de churn — projeto-fio-condutor do curso de MLOps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "mlflow>=3.16.0",
]

[dependency-groups]
data = [
    "dvc>=3.55",
]
# A API e o front são grupos à parte, não dependências do projeto, pela mesma
# régua do `data`: a imagem de treino não precisa de servidor HTTP nem de
# Streamlit, e carregar os dois dobraria o que o container baixa para treinar.
# Cada Dockerfile instala só o seu grupo.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
app = [
    "streamlit>=1.40",
    "requests>=2.32",
]
dev = [
    "pytest>=8.0",
    # TestClient do FastAPI: testa a API sem subir servidor nem abrir porta.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
