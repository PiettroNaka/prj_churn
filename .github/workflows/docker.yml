# Valida o entregável do Encontro 3 sem depender de Docker na máquina do aluno:
# o runner do GitHub tem Docker, então o build e os testes rodam no container aqui.
name: docker

on:
  push:
    # As branches de trabalho também: um entregável que nunca passou pelo CI é
    # um entregável verificado só na máquina de quem escreveu.
    branches: [main, 'claude/**', 'feat/**']
  pull_request:

jobs:
  # O entregável do deploy: a imagem do Hugging Face Spaces, que roda a pilha
  # inteira num container só. Job à parte porque ele constrói do zero (clone +
  # uv sync + treino + promoção) e não tem por que atrasar o resto.
  spaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A imagem clona o repositório em vez de copiar o contexto, então o build
      # tem de apontar para a ref DESTE job — senão o CI validaria a main
      # enquanto a mudança a ser testada está na branch.
      - name: Constrói a imagem do Space
        run: |
          docker build \
            --build-arg REPO="${{ github.server_url }}/${{ github.repository }}" \
            --build-arg REF="${{ github.head_ref || github.ref_name }}" \
            -t churn-spaces:ci \
            deploy/spaces

      - name: Tamanho da imagem
        run: docker images churn-spaces:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}"

      - name: O container sobe e o front responde
        run: |
          docker run -d --name spaces -p 7860:7860 churn-spaces:ci
          for _ in $(seq 1 48); do
            if curl -fsS http://localhost:7860/_stcore/health >/dev/null 2>&1; then
              echo "front no ar"; exit 0
            fi
            sleep 5
          done
          echo "--- o front não respondeu; log do container ---"
          docker logs spaces
          exit 1

      # O ponto do desenho: o front fala com a API, e a API serve o campeão
      # promovido. Se isto passar, o Space não está em modo demonstração.
      - name: A API interna serve o campeão promovido
        run: |
          docker exec spaces sh -c \
            'cd /home/usuario/app && .venv/bin/python scripts/conferir_api.py'

      - name: Derruba o container
        if: always()
        run: docker rm -f spaces || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # O CSV saiu do Git no Encontro 5 (DVC). Sem remote acessível aqui,
          # scripts/fetch_data.sh recupera os bytes do blob anterior ao DVC —
          # e blob antigo exige histórico completo, não o clone raso padrão.
          fetch-depth: 0

      - name: Build da imagem
        run: docker build -t churn:0.1 .

      - name: Testes dentro do container
        # tests/ não entra na imagem (só src/); entra por volume, como os dados
        run: docker run --rm -v "$PWD/tests:/app/tests" churn:0.1 uv run pytest -q

      - name: Tamanho da imagem
        run: docker images churn:0.1 --format "{{.Repository}}:{{.Tag}} {{.Size}}"

      # Materializa o dado rastreado pelo DVC e, de quebra, confere o ponteiro:
      # o script só termina bem se o md5 do arquivo bater com data/churn.csv.dvc.
      - name: Materializa o dataset (DVC)
        run: ./scripts/fetch_data.sh

      # Checkpoint do Encontro 5: registrar duas versões não basta — tem de dar
      # para alternar entre elas, e o dado tem de seguir o ponteiro. O script
      # falha se o md5 do CSV não bater com o do .dvc depois da troca.
      - name: Alterna entre as duas versões do dado
        run: |
          ./scripts/alternar_versao.sh v1
          ./scripts/alternar_versao.sh v2

      # Slide 13 do Encontro 5: "o dado vem por dvc pull". Aqui isso é provado, não
      # afirmado — o remote é semeado pelo próprio DVC dentro do container
      # (commit + push numa execução só, porque o cache morre com o --rm), o CSV
      # é apagado, e um container novo tem de trazê-lo de volta do remote.
      - name: Deploy — o dado vem por dvc pull, não pela imagem
        run: |
          docker build -f Dockerfile.dados -t churn-dados:0.1 .
          docker images churn-dados:0.1 --format "imagem de dados: {{.Size}}"
          mkdir -p "$PWD/../dvc-storage"

          dvc() {
            docker run --rm \
              -v "$PWD/data:/app/data" \
              -v "$PWD/../dvc-storage:/dvc-storage" \
              "$@"
          }

          dvc --entrypoint sh churn-dados:0.1 -c \
            'uv run --frozen --no-sync dvc commit -f data/churn.csv.dvc \
             && uv run --frozen --no-sync dvc push'

          rm data/churn.csv
          test ! -f data/churn.csv

          dvc churn-dados:0.1 pull

          esperado=$(sed -n 's/^[[:space:]-]*md5:[[:space:]]*\([0-9a-f]\{32\}\).*/\1/p' \
            data/churn.csv.dvc | head -1)
          echo "$esperado  data/churn.csv" | md5sum -c -

      # Checkpoint do Encontro 4: o dado adulterado de propósito tem de reprovar.
      # scripts/ não entra na imagem (só src/); entra por volume, como os dados.
      - name: Quebra proposital (o contrato tem de pegar)
        run: |
          docker run --rm \
            -v "$PWD/data:/app/data" \
            -v "$PWD/scripts:/app/scripts" \
            churn:0.1 uv run python scripts/quebra_proposital.py

      # O checkpoint do Encontro 3 é o treino rodando DENTRO do container, com o
      # dataset entrando por volume — e continua rodando depois do DVC, agora com
      # o dado vindo do ponteiro em vez de vir do Git.
      - name: Treino no container (dados via volume)
        run: |
          mkdir -p artifacts mlruns
          docker run --rm \
            -e CHURN_MLFLOW_TRACKING_URI=sqlite:////app/mlruns/mlflow.db \
            -e CHURN_GIT_COMMIT="$GITHUB_SHA" \
            -v "$PWD/data:/app/data" \
            -v "$PWD/artifacts:/app/artifacts" \
            -v "$PWD/mlruns:/app/mlruns" \
            churn:0.1
          echo "--- artefato gerado no host, via volume ---"
          ls -lh artifacts/

      # Checkpoint do Encontro 6: o treino tem de deixar rastro, e o rastro tem
      # de apontar para o dado certo. Confere que o run existe e que a tag
      # data_md5 bate com o md5 do ponteiro do DVC — a cadeia fechando.
      - name: O run do MLflow registrou a linhagem
        run: |
          esperado=$(sed -n 's/^[[:space:]-]*md5:[[:space:]]*\([0-9a-f]\{32\}\).*/\1/p' \
            data/churn.csv.dvc | head -1)
          docker run --rm \
            -e CHURN_MLFLOW_TRACKING_URI=sqlite:////app/mlruns/mlflow.db \
            -e ESPERADO="$esperado" \
            -v "$PWD/mlruns:/app/mlruns" \
            -v "$PWD/scripts:/app/scripts" \
            churn:0.1 uv run python scripts/conferir_run.py

      # O modelo tem de RODAR, não só existir: carrega do MLflow e prevê a partir
      # de linhas cruas do CSV — com customerID e TotalCharges em texto, como
      # saem do sistema de origem. Um modelo que só aceita feature codificada
      # não sai do notebook.
      - name: O modelo roda a partir do MLflow
        run: |
          docker run --rm \
            -e CHURN_MLFLOW_TRACKING_URI=sqlite:////app/mlruns/mlflow.db \
            -v "$PWD/mlruns:/app/mlruns" \
            -v "$PWD/data:/app/data" \
            -v "$PWD/scripts:/app/scripts" \
            churn:0.1 uv run python scripts/prever.py --n 5

      # A pilha de serviço, em Docker: promover o campeão, subir a API e
      # conferir que ela responde pela rede. Os testes de unidade da API são
      # pulados dentro da imagem de treino (ela não instala o grupo `api`, e é
      # o ponto de ela ser enxuta) — quem cobre a API no container é isto, e é
      # evidência melhor: prova que a imagem sobe, carrega o campeão e serve.
      - name: Promove o campeão no Registry
        run: docker compose run --rm promover

      - name: Sobe a API e espera o healthcheck
        run: |
          docker compose up -d api
          for _ in $(seq 1 40); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose ps -q api)" 2>/dev/null || echo partindo)
            echo "healthcheck: $estado"
            [ "$estado" = healthy ] && exit 0
            [ "$estado" = unhealthy ] && break
            sleep 5
          done
          echo "--- a API não ficou saudável; log do container ---"
          docker compose logs api
          exit 1

      # O cliente de teste sai do próprio contrato do dataset: se o schema
      # ganhar uma coluna, esta chamada ganha junto.
      - name: A API serve o modelo promovido
        run: |
          docker compose run --rm --no-deps \
            -v "$PWD/scripts:/app/scripts" \
            -e CHURN_API_URL=http://api:8000 \
            app uv run --frozen --no-dev --group app \
            python scripts/conferir_api.py

      - name: O front constrói e carrega
        run: |
          docker compose build app
          docker compose up -d app
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then
              echo "front no ar"; exit 0
            fi
            sleep 5
          done
          echo "--- o front não respondeu; log do container ---"
          docker compose logs app
          exit 1

      - name: Derruba a pilha
        if: always()
        run: docker compose down -v

      - name: Publica o modelo treinado
        uses: actions/upload-artifact@v7
        with:
          name: churn-model
          path: artifacts/churn_model.pkl

  # O entregável do deploy em EC2: o dado em Postgres e a pilha de dois
  # containers do desenho. Job à parte do `build` porque os testes de banco
  # precisam de um Postgres de verdade, e a imagem de treino não carrega o
  # driver — cada imagem instala só o seu grupo.
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: churn
          POSTGRES_PASSWORD: churn
          POSTGRES_DB: churn
        ports:
          - 5432:5432
        # sem o healthcheck o job começa antes de o banco aceitar conexão
        options: >-
          --health-cmd "pg_isready -U churn -d churn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # uv pelo PyPI: sem depender da versão de uma action do marketplace.
      - name: Instala o uv
        run: pipx install uv

      - name: Ambiente travado, com o grupo do banco
        run: uv sync --frozen --group db --group dev

      # Estes testes PULAM sem a variável. Defini-la aqui é o que os faz rodar
      # de verdade — um teste de banco que pula em silêncio não prova nada, e
      # por isso o passo começa exigindo que o serviço esteja mesmo de pé.
      - name: Testes do banco, contra um Postgres de verdade
        env:
          CHURN_TEST_DATABASE_URL: postgresql+psycopg://churn:churn@localhost:5432/churn
        run: |
          uv run --frozen --group db python -c "
          import os, sqlalchemy as sa
          sa.create_engine(os.environ['CHURN_TEST_DATABASE_URL']).connect().close()
          print('o Postgres do CI respondeu')
          "
          # -rs imprime o motivo de qualquer skip. Com a conexão acima provada,
          # um skip aqui só poderia vir da variável não chegar ao pytest — e
          # apareceria no relatório em vez de passar por verde.
          uv run --frozen --group db --group dev pytest tests/test_db.py -v -rs

      - name: Materializa o dataset
        run: uv run --frozen --group data python scripts/preparar.py --so-dado

      # A prova que interessa: o dataset inteiro entra no banco passando pelo
      # contrato, e ler de lá dá exatamente o mesmo DataFrame que ler o CSV.
      - name: O dataset inteiro, pelo banco e pelo arquivo
        env:
          CHURN_DATABASE_URL: postgresql+psycopg://churn:churn@localhost:5432/churn
        run: |
          uv run --frozen --group db python -m churn.db
          uv run --frozen --group db python - <<'PY'
          import os
          import pandas as pd
          from churn.data import load_clean
          from churn.db import contar, ler, motor

          url = os.environ["CHURN_DATABASE_URL"]
          maquina = motor(url)
          print(f"linhas no banco: {contar(maquina)}")

          pd.testing.assert_frame_equal(pd.read_csv("data/churn.csv"), ler(maquina))
          print("ok   ler do banco == ler o CSV (colunas, tipos e ordem das linhas)")

          pd.testing.assert_frame_equal(
              load_clean("data/churn.csv", "customerID", "Churn", None, None),
              load_clean("data/churn.csv", "customerID", "Churn", None, url),
          )
          print("ok   o pipeline dá o mesmo resultado pelas duas origens")
          PY

      # E o modelo: treinar pelo banco tem de dar o MESMO modelo que pelo CSV.
      # Se a ordem das linhas escorregar, isto pega — é o que o ORDER BY protege.
      - name: Treinar pelo banco dá o mesmo modelo que pelo CSV
        env:
          CHURN_DATABASE_URL: postgresql+psycopg://churn:churn@localhost:5432/churn
        run: |
          uv run --frozen --group db python - <<'PY'
          import os
          import numpy as np
          from churn.config import settings
          from churn.model import ajustar

          url = os.environ["CHURN_DATABASE_URL"]
          m_arq, _, met_arq = ajustar(settings.model_copy(update={"database_url": None}))
          m_bd, _, met_bd = ajustar(settings.model_copy(update={"database_url": url}))

          for chave in sorted(met_arq):
              iguais = abs(met_arq[chave] - met_bd[chave]) < 1e-12
              print(f"  {chave:<10} {met_arq[chave]:.6f}  {met_bd[chave]:.6f}  "
                    f"{'ok' if iguais else 'DIFERENTE'}")
              assert iguais, f"{chave} mudou ao trocar a origem do dado"

          assert list(m_arq.feature_names_in_) == list(m_bd.feature_names_in_)
          assert np.array_equal(m_arq.feature_importances_, m_bd.feature_importances_)
          print("ok   modelo idêntico pelas duas origens")
          PY

  # A pilha do desenho, de ponta a ponta: dois containers numa máquina só.
  ec2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sobe os dois containers
        env:
          POSTGRES_PASSWORD: senha-de-ci-nao-reaproveitar
        run: docker compose -f compose.ec2.yml up -d --build

      - name: Espera a aplicação ficar saudável (com modelo carregado)
        env:
          POSTGRES_PASSWORD: senha-de-ci-nao-reaproveitar
        run: |
          for _ in $(seq 1 60); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose -f compose.ec2.yml ps -q web)" 2>/dev/null || echo partindo)
            [ "$estado" = "healthy" ] && echo "web saudável" && exit 0
            [ "$estado" = "unhealthy" ] && break
            sleep 10
          done
          echo "--- a aplicação não ficou saudável; log ---"
          docker compose -f compose.ec2.yml logs web
          exit 1

      - name: São dois containers, e o banco tem o dataset
        env:
          POSTGRES_PASSWORD: senha-de-ci-nao-reaproveitar
        run: |
          docker compose -f compose.ec2.yml ps
          linhas=$(docker compose -f compose.ec2.yml exec -T postgres \
            psql -U churn -d churn -tAc "SELECT count(*) FROM clientes")
          echo "linhas na tabela clientes: $linhas"
          [ "$linhas" = "7043" ] || { echo "esperava 7043 linhas no banco"; exit 1; }

      - name: O front responde, e a API serve o campeão promovido
        env:
          POSTGRES_PASSWORD: senha-de-ci-nao-reaproveitar
        run: |
          curl -fsS http://localhost/_stcore/health >/dev/null && echo "ok   front no ar na porta 80"
          docker compose -f compose.ec2.yml exec -T web \
            /app/.venv/bin/python - <<'PY'
          import json, urllib.request
          modelo = json.load(urllib.request.urlopen("http://127.0.0.1:8000/modelo"))
          print("ok   /modelo:", modelo)
          assert "champion" in json.dumps(modelo), "a API não aponta para o alias"
          PY

      - name: O banco não está exposto para fora do compose
        env:
          POSTGRES_PASSWORD: senha-de-ci-nao-reaproveitar
        run: |
          portas() {
            docker inspect --format '{{json .NetworkSettings.Ports}}' \
              "$(docker compose -f compose.ec2.yml ps -q "$1")"
          }
          # `docker compose port` NÃO serve aqui: sem porta publicada ele
          # imprime "invalid IP:0" e mesmo assim sai com 0. O que distingue os
          # dois casos é a presença de HostPort no inspect.
          banco=$(portas postgres); web=$(portas web)
          echo "postgres: $banco"
          echo "web:      $web"

          # Controle positivo primeiro: se nem a porta do web aparecer, é esta
          # verificação que está quebrada, e não o compose. Sem ele, um grep que
          # nunca casa passaria por "o banco não publicou nada".
          if ! echo "$web" | grep -q '"HostPort":"80"'; then
            echo "a verificação não enxerga nem a porta publicada do web"
            echo "=> inconclusiva; não afirmo nada sobre o banco"
            exit 1
          fi
          echo "ok   o controle positivo enxerga a porta 80 do web"

          if echo "$banco" | grep -q 'HostPort'; then
            echo "o Postgres publicou porta no host — não deveria"
            exit 1
          fi
          echo "ok   o Postgres só existe na rede interna"

      - name: Derruba a pilha
        if: always()
        env:
          POSTGRES_PASSWORD: senha-de-ci-nao-reaproveitar
        run: docker compose -f compose.ec2.yml down -v
